version: 2
updates:
  # Weekly PRs to dev that bump the dev tools pinned in uv.lock
  - package-ecosystem: "uv"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"

  # Weekly PRs to dev that bump the pinned GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
