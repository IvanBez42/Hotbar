version: 2
updates:
  # Monthly PRs to dev that bump the dev tools pinned in uv.lock
  - package-ecosystem: "uv"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "monthly"

  # Monthly PRs to dev that bump the pinned GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "monthly"
